name: CIFAR-10 ResNet pilot

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/cifar_resnet_pilot.py'
      - '.github/workflows/cifar_resnet_pilot.yml'
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt torchvision==0.25.0
      - name: Ensure CIFAR-10 is available
        shell: bash
        run: |
          mkdir -p .cache/cifar10
          python - <<'PY' || {
          from torchvision.datasets import CIFAR10
          CIFAR10('.cache/cifar10', train=True, download=True)
          CIFAR10('.cache/cifar10', train=False, download=True)
          PY
            echo 'torchvision download failed; trying direct mirrors'
            curl -L --fail https://www.cs.toronto.edu/~kriz/cifar-10-python.tar.gz -o /tmp/cifar.tar.gz || \
            curl -L --fail 'https://www.dropbox.com/scl/fi/6mhiq4rtfszqrosasp8a9/cifar-10-batches-py.tar.gz?rlkey=g6v114un4je233j52tu5tdsbe&st=gxo2e50q&dl=1' -o /tmp/cifar.tar.gz
            tar -xzf /tmp/cifar.tar.gz -C .cache/cifar10
          }
      - name: Run paired pilot
        run: |
          mkdir -p artifacts
          python experiments/cifar_resnet_pilot.py \
            --reps 3 --epochs 3 --train-per-class 600 --test-per-class 300 \
            --test-envs 16 --k 8 --q 4 \
            --output artifacts/cifar_resnet_pilot.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cifar-resnet-pilot
          path: artifacts/*.csv
          if-no-files-found: warn
