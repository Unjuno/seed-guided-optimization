name: SmallCNN finite-budget Q-scaling replication

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - 'experiments/cnn_budget_scaling.py'
      - 'experiments/summarize_cnn_budget_scaling.py'
      - '.github/workflows/cnn_budget_scaling.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {start: 1500, end: 1505}
          - {start: 1505, end: 1510}
          - {start: 1510, end: 1515}
          - {start: 1515, end: 1520}
          - {start: 1520, end: 1525}
          - {start: 1525, end: 1530}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned CPU runtime
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Protocol and selector self-test only
        run: python experiments/cnn_budget_scaling.py selftest
      - name: Train all Q and seal states before heldout construction
        run: python experiments/cnn_budget_scaling.py train --start ${{ matrix.start }} --end ${{ matrix.end }} --output-dir artifacts
      - name: Verify seals and evaluate fresh full-strength heldout
        run: python experiments/cnn_budget_scaling.py evaluate --start ${{ matrix.start }} --end ${{ matrix.end }} --output-dir artifacts
      - name: Archive source and runtime provenance
        if: always()
        run: |
          mkdir -p artifacts/source
          cp experiments/common.py experiments/cnn_regime_interaction.py experiments/cnn_budget_scaling.py experiments/summarize_cnn_budget_scaling.py requirements.txt artifacts/source/
          python -m pip freeze > artifacts/pip-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cnn-budget-shard-${{ matrix.start }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install summarizer runtime
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0
      - uses: actions/download-artifact@v4
        with:
          pattern: cnn-budget-shard-*
          path: downloaded
          merge-multiple: false
      - name: Apply frozen Issue 70 decision and Q16 identity check
        run: python experiments/summarize_cnn_budget_scaling.py --input-dir downloaded --output-dir aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: cnn-budget-aggregate30
          path: aggregate/*.csv
          if-no-files-found: error
          retention-days: 90
