name: SmallCNN full-strength regime interaction

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - 'experiments/cnn_regime_interaction.py'
      - '.github/workflows/cnn_regime_interaction.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {start: 1400, end: 1405}
          - {start: 1405, end: 1410}
          - {start: 1410, end: 1415}
          - {start: 1415, end: 1420}
          - {start: 1420, end: 1425}
          - {start: 1425, end: 1430}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned CPU runtime
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Split and synthetic self-tests only
        run: python experiments/cnn_regime_interaction.py selftest
      - name: Train and seal SmallCNN states before evaluation
        run: python experiments/cnn_regime_interaction.py train --start ${{ matrix.start }} --end ${{ matrix.end }} --output-dir artifacts
      - name: Verify seals and evaluate fixed strengths
        run: python experiments/cnn_regime_interaction.py evaluate --start ${{ matrix.start }} --end ${{ matrix.end }} --output-dir artifacts
      - name: Archive source and runtime provenance
        if: always()
        run: |
          mkdir -p artifacts/source
          cp experiments/common.py experiments/fixed_dose_response.py experiments/cnn_regime_interaction.py requirements.txt artifacts/source/
          python -m pip freeze > artifacts/pip-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cnn-regime-shard-${{ matrix.start }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU summarizer runtime
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - uses: actions/download-artifact@v4
        with:
          pattern: cnn-regime-shard-*
          path: downloaded
          merge-multiple: false
      - name: Verify all hashes and apply frozen Issue 67 decision
        run: python experiments/cnn_regime_interaction.py summarize --input-dir downloaded --output-dir aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: cnn-regime-aggregate30
          path: aggregate/*.csv
          if-no-files-found: error
          retention-days: 90
