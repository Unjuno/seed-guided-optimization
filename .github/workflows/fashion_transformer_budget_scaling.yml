name: FashionMNIST Tiny Transformer finite-budget Q-scaling

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - 'experiments/fashion_transformer_budget_scaling.py'
      - 'experiments/summarize_fashion_transformer_budget_scaling.py'
      - '.github/workflows/fashion_transformer_budget_scaling.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  OPENBLAS_NUM_THREADS: '4'
  NUMEXPR_NUM_THREADS: '4'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {start: 30, end: 35}
          - {start: 35, end: 40}
          - {start: 40, end: 45}
          - {start: 45, end: 50}
          - {start: 50, end: 55}
          - {start: 55, end: 60}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Pre-download FashionMNIST
        run: |
          python - <<'PY'
          from torchvision.datasets import FashionMNIST
          root='.cache/fashionmnist'
          FashionMNIST(root,train=True,download=True)
          FashionMNIST(root,train=False,download=True)
          print('FashionMNIST ready')
          PY
      - name: Protocol and Q8 selector self-test only
        run: python experiments/fashion_transformer_budget_scaling.py selftest
      - name: Pretrain once per rep; finetune all Q; seal states before heldout
        run: python experiments/fashion_transformer_budget_scaling.py train --start ${{ matrix.start }} --end ${{ matrix.end }} --output-dir artifacts
      - name: Verify seals and evaluate fresh heldout environments
        run: python experiments/fashion_transformer_budget_scaling.py evaluate --start ${{ matrix.start }} --end ${{ matrix.end }} --output-dir artifacts
      - name: Archive source and dependency provenance
        if: always()
        run: |
          mkdir -p artifacts/source
          cp experiments/fashion_transformer_rep_rank_audit.py experiments/fashion_transformer_budget_scaling.py experiments/summarize_fashion_transformer_budget_scaling.py artifacts/source/
          python -m pip freeze > artifacts/pip-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fashion-budget-shard-${{ matrix.start }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install summarizer dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0
      - uses: actions/download-artifact@v4
        with:
          pattern: fashion-budget-shard-*
          path: downloaded
          merge-multiple: false
      - name: Apply frozen Issue 73 decision and Q8 identity check
        run: python experiments/summarize_fashion_transformer_budget_scaling.py --input-dir downloaded --output-dir aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: fashion-budget-aggregate30
          path: aggregate/*.csv
          if-no-files-found: error
          retention-days: 90
