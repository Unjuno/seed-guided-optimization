name: Fixed-dose functional-response audit

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - 'experiments/fixed_dose_response.py'
      - '.github/workflows/fixed_dose_response.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {start: 1200, end: 1205}
          - {start: 1205, end: 1210}
          - {start: 1210, end: 1215}
          - {start: 1215, end: 1220}
          - {start: 1220, end: 1225}
          - {start: 1225, end: 1230}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned CPU runtime
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Synthetic tests only
        run: python experiments/fixed_dose_response.py selftest
      - name: Train all shard states before constructing evaluation inputs
        run: python experiments/fixed_dose_response.py train --start ${{ matrix.start }} --end ${{ matrix.end }} --output-dir artifacts
      - name: Verify seals and evaluate fixed strengths
        run: python experiments/fixed_dose_response.py evaluate --start ${{ matrix.start }} --end ${{ matrix.end }} --output-dir artifacts
      - name: Archive source and dependency provenance
        if: always()
        run: |
          mkdir -p artifacts/source
          cp experiments/common.py experiments/transfer_specificity.py experiments/fixed_dose_response.py requirements.txt artifacts/source/
          python -m pip freeze > artifacts/pip-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-dose-shard-${{ matrix.start }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU summarizer runtime
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0
      - uses: actions/download-artifact@v4
        with:
          pattern: fixed-dose-shard-*
          path: downloaded
          merge-multiple: false
      - name: Verify all 60 hashes and apply frozen decision
        run: python experiments/fixed_dose_response.py summarize --input-dir downloaded --output-dir aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: fixed-dose-aggregate30
          path: aggregate/*.csv
          if-no-files-found: error
          retention-days: 90
