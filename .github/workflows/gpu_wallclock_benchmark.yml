name: GPU wall-clock benchmark (self-hosted)

on:
  workflow_dispatch:
    inputs:
      reps:
        description: Independent benchmark repetitions
        required: true
        default: '3'
      wall_seconds:
        description: Seconds per fixed-wall-clock condition
        required: true
        default: '30'
      fixed_updates:
        description: Updates per fixed-update condition
        required: true
        default: '80'
      counts:
        description: Comma-separated candidate counts from 2,4,8,16
        required: true
        default: '2,4,8,16'

permissions:
  contents: read

jobs:
  benchmark:
    # Requires a repository/organization self-hosted runner carrying all four labels.
    # The runner must provide a CUDA-compatible PyTorch build; no CPU fallback is allowed.
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned non-Torch dependencies
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Verify runner-provided NVIDIA and PyTorch runtime
        run: |
          nvidia-smi
          python - <<'PY'
          import torch
          assert torch.cuda.is_available(), 'CUDA unavailable or runner PyTorch is not CUDA-enabled'
          print(torch.__version__, torch.version.cuda, torch.cuda.get_device_name(0))
          PY
      - name: Run synchronized GPU benchmark
        run: |
          python experiments/gpu_wallclock_benchmark.py \
            --output-dir gpu-benchmark \
            --reps '${{ inputs.reps }}' \
            --wall-seconds '${{ inputs.wall_seconds }}' \
            --fixed-updates '${{ inputs.fixed_updates }}' \
            --counts '${{ inputs.counts }}'
      - name: Capture system metadata
        if: always()
        run: |
          mkdir -p gpu-benchmark
          nvidia-smi -q > gpu-benchmark/nvidia-smi-q.txt || true
          nvidia-smi --query-gpu=name,uuid,driver_version,pstate,temperature.gpu,power.limit,memory.total --format=csv > gpu-benchmark/nvidia-static.csv || true
          pip freeze > gpu-benchmark/pip-freeze.txt
          uname -a > gpu-benchmark/uname.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-wallclock-benchmark
          path: gpu-benchmark/
          retention-days: 90
          if-no-files-found: warn
