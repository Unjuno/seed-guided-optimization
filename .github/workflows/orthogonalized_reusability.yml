name: Orthogonalized nuisance reusability test

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/orthogonalized_reusability.py'
      - 'experiments/summarize_orthogonalized_calibration.py'
      - 'experiments/summarize_orthogonalized_reusability.py'
      - '.github/workflows/orthogonalized_reusability.yml'
  workflow_dispatch:

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: reps750_754
            start: 750
            end: 755
          - shard: reps755_759
            start: 755
            end: 760
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run training-only calibration
        run: |
          mkdir -p artifacts
          python experiments/orthogonalized_reusability.py calibrate --start ${{ matrix.start }} --end ${{ matrix.end }} --output-dir artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: orthogonalized-calibration-${{ matrix.shard }}
          path: artifacts/*.csv
          if-no-files-found: error

  calibration_summary:
    needs: calibration
    runs-on: ubuntu-latest
    outputs:
      selected_alpha: ${{ steps.seal.outputs.selected_alpha }}
      selected_gamma: ${{ steps.seal.outputs.selected_gamma }}
      calibration_pass: ${{ steps.seal.outputs.calibration_pass }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install summarizer dependencies
        run: pip install numpy==2.3.5 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          pattern: orthogonalized-calibration-*
          path: downloaded
          merge-multiple: true
      - name: Apply frozen calibration gate
        run: python experiments/summarize_orthogonalized_calibration.py --input-dir downloaded --output-dir calibration_aggregate
      - name: Seal calibration outputs
        id: seal
        run: |
          alpha=$(python - <<'PY'
          import pandas as pd
          d=pd.read_csv('calibration_aggregate/orthogonalized_calibration_decision.csv')
          print(f"{float(d.loc[0,'selected_alpha']):.2f}")
          PY
          )
          gamma=$(python - <<'PY'
          import pandas as pd
          d=pd.read_csv('calibration_aggregate/orthogonalized_calibration_decision.csv')
          print(f"{float(d.loc[0,'selected_gamma']):.2f}")
          PY
          )
          passed=$(python - <<'PY'
          import pandas as pd
          d=pd.read_csv('calibration_aggregate/orthogonalized_calibration_decision.csv')
          print(str(bool(d.loc[0,'calibration_pass'])).lower())
          PY
          )
          echo "selected_alpha=$alpha" >> "$GITHUB_OUTPUT"
          echo "selected_gamma=$gamma" >> "$GITHUB_OUTPUT"
          echo "calibration_pass=$passed" >> "$GITHUB_OUTPUT"
          echo "SEALED_ALPHA=$alpha SEALED_GAMMA=$gamma CALIBRATION_PASS=$passed"
      - uses: actions/upload-artifact@v4
        with:
          name: orthogonalized-calibration-decision
          path: calibration_aggregate/*.csv
          if-no-files-found: error

  confirm:
    needs: calibration_summary
    if: needs.calibration_summary.outputs.calibration_pass == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: reps800_804
            start: 800
            end: 805
          - shard: reps805_809
            start: 805
            end: 810
          - shard: reps810_814
            start: 810
            end: 815
          - shard: reps815_819
            start: 815
            end: 820
          - shard: reps820_824
            start: 820
            end: 825
          - shard: reps825_829
            start: 825
            end: 830
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run sealed confirmatory training
        run: |
          mkdir -p artifacts
          python experiments/orthogonalized_reusability.py train --start ${{ matrix.start }} --end ${{ matrix.end }} --alpha ${{ needs.calibration_summary.outputs.selected_alpha }} --gamma ${{ needs.calibration_summary.outputs.selected_gamma }} --output-dir artifacts
      - name: Evaluate fresh held-out environments
        run: python experiments/orthogonalized_reusability.py evaluate --start ${{ matrix.start }} --end ${{ matrix.end }} --alpha ${{ needs.calibration_summary.outputs.selected_alpha }} --gamma ${{ needs.calibration_summary.outputs.selected_gamma }} --output-dir artifacts
      - name: Remove model states before upload
        if: always()
        run: rm -rf artifacts/states
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orthogonalized-confirm-${{ matrix.shard }}
          path: artifacts/*.csv
          if-no-files-found: warn

  aggregate:
    needs: [calibration_summary, confirm]
    if: needs.calibration_summary.outputs.calibration_pass == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install summarizer dependencies
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0
      - uses: actions/download-artifact@v4
        with:
          pattern: orthogonalized-confirm-*
          path: downloaded
          merge-multiple: true
      - name: Apply preregistered conversion decision
        run: python experiments/summarize_orthogonalized_reusability.py --input-dir downloaded --output-dir aggregate --sealed-alpha ${{ needs.calibration_summary.outputs.selected_alpha }} --sealed-gamma ${{ needs.calibration_summary.outputs.selected_gamma }}
      - uses: actions/upload-artifact@v4
        with:
          name: orthogonalized-aggregate30
          path: aggregate/*.csv
          if-no-files-found: error
