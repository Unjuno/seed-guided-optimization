name: Parameter-matched novelty calibration

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - 'experiments/parameter_matched_novelty_calibration.py'
      - '.github/workflows/parameter_matched_novelty_calibration.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {start: 1700, end: 1705}
          - {start: 1705, end: 1710}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned CPU runtime
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Synthetic matching self-test only
        run: python experiments/parameter_matched_novelty_calibration.py selftest
      - name: Training-only common-reference calibration
        run: python experiments/parameter_matched_novelty_calibration.py pilot --start ${{ matrix.start }} --end ${{ matrix.end }} --output-dir artifacts
      - name: Archive calibration provenance
        run: |
          mkdir -p artifacts/source
          cp experiments/common.py experiments/cnn_regime_interaction.py experiments/transfer_specificity.py experiments/parameter_matched_novelty_calibration.py requirements.txt artifacts/source/
          python -m pip freeze > artifacts/pip-freeze.txt
      - uses: actions/upload-artifact@v4
        with:
          name: parameter-match-pilot-${{ matrix.start }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install summarizer runtime
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - uses: actions/download-artifact@v4
        with:
          pattern: parameter-match-pilot-*
          path: downloaded
          merge-multiple: false
      - name: Apply frozen Stage-A selection rule
        run: python experiments/parameter_matched_novelty_calibration.py summarize --input-dir downloaded --output-dir aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: parameter-match-calibration
          path: aggregate/*.csv
          if-no-files-found: error
          retention-days: 90
