name: Parameter-matched gradient novelty confirmatory

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - 'experiments/parameter_matched_novelty_confirmatory.py'
      - 'experiments/summarize_parameter_matched_novelty.py'
      - '.github/workflows/parameter_matched_novelty_confirmatory.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {start: 1800, end: 1805}
          - {start: 1805, end: 1810}
          - {start: 1810, end: 1815}
          - {start: 1815, end: 1820}
          - {start: 1820, end: 1825}
          - {start: 1825, end: 1830}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned CPU runtime
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Synthetic fixed-caliper self-test only
        run: python experiments/parameter_matched_novelty_confirmatory.py selftest
      - name: Build fresh parameter-matched shared-reference schedules
        run: python experiments/parameter_matched_novelty_confirmatory.py reference --start ${{ matrix.start }} --end ${{ matrix.end }} --output-dir artifacts
      - name: Archive scientific source and runtime
        run: |
          mkdir -p artifacts/source
          cp experiments/common.py experiments/cnn_regime_interaction.py experiments/fixed_dose_response.py experiments/transfer_specificity.py experiments/parameter_matched_novelty_calibration.py experiments/parameter_matched_novelty_confirmatory.py experiments/summarize_parameter_matched_novelty.py artifacts/source/
          python -m pip freeze > artifacts/reference-pip-freeze.txt
      - uses: actions/upload-artifact@v4
        with:
          name: parameter-matched-reference-${{ matrix.start }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  train:
    needs: reference
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {start: 1800, end: 1805}
          - {start: 1805, end: 1810}
          - {start: 1810, end: 1815}
          - {start: 1815, end: 1820}
          - {start: 1820, end: 1825}
          - {start: 1825, end: 1830}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned CPU runtime
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: parameter-matched-reference-${{ matrix.start }}
          path: artifacts
      - name: Verify matched schedules and train fixed arms
        run: python experiments/parameter_matched_novelty_confirmatory.py train --start ${{ matrix.start }} --end ${{ matrix.end }} --output-dir artifacts
      - name: Archive arm runtime
        run: python -m pip freeze > artifacts/arm-pip-freeze.txt
      - uses: actions/upload-artifact@v4
        with:
          name: parameter-matched-train-${{ matrix.start }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  evaluate:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {start: 1800, end: 1805}
          - {start: 1805, end: 1810}
          - {start: 1810, end: 1815}
          - {start: 1815, end: 1820}
          - {start: 1820, end: 1825}
          - {start: 1825, end: 1830}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned CPU runtime
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: parameter-matched-train-${{ matrix.start }}
          path: artifacts
      - name: Verify seals and evaluate fresh heldout
        run: python experiments/parameter_matched_novelty_confirmatory.py evaluate --start ${{ matrix.start }} --end ${{ matrix.end }} --output-dir artifacts
      - name: Archive evaluation runtime
        run: python -m pip freeze > artifacts/eval-pip-freeze.txt
      - uses: actions/upload-artifact@v4
        with:
          name: parameter-matched-eval-${{ matrix.start }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install summarizer runtime
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0
      - uses: actions/download-artifact@v4
        with:
          pattern: parameter-matched-eval-*
          path: downloaded
          merge-multiple: false
      - name: Apply frozen Issue-83 Stage-B decision
        run: python experiments/summarize_parameter_matched_novelty.py --input-dir downloaded --output-dir aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: parameter-matched-aggregate30
          path: aggregate/*.csv
          if-no-files-found: error
          retention-days: 90
