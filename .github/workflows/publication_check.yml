name: Public documentation and CSV checks

on:
  pull_request:
    paths:
      - 'README.md'
      - 'README.en.md'
      - 'CITATION.cff'
      - 'docs/README.md'
      - 'docs/QUICKSTART.md'
      - 'docs/SHARE_ON_X.md'
      - 'experiments/README.md'
      - 'results/README.md'
      - 'docs/RESEARCH_STATUS.md'
      - 'docs/RESEARCH_ROADMAP.md'
      - 'docs/ROADMAP_VALIDATION_20260926_RESULT.md'
      - 'results/roadmap_validation_20260926_primary.csv'
      - 'results/roadmap_validation_20260926_pool_contrasts.csv'
      - 'scripts/check_roadmap_validation_results.py'
      - 'scripts/check_switch_seed_results.py'
      - 'scripts/check_switch_time_boundary_20261107.py'
      - 'docs/SWITCH_TIME_BOUNDARY_RESULT_20261107.md'
      - 'results/switch_time_20261107_primary.csv'
      - 'results/switch_time_20261107_pool_differences.csv'
      - 'results/switch_time_20261107_policy_means.csv'
      - 'results/switch_seed_20261031_primary_decisions.csv'
      - 'results/switch_seed_20261031_pool_differences.csv'
      - 'docs/OPTIMIZER_SWITCH_SEED_RESULT_20261031.md'
      - 'results/translation_matched_primary30.csv'
      - 'results/translation_matched_summary30.csv'
      - 'requirements-check.txt'
      - 'scripts/check_public_results.py'
      - 'scripts/test_public_results.py'
      - 'scripts/check_public_docs.py'
      - '.github/workflows/publication_check.yml'
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'README.en.md'
      - 'CITATION.cff'
      - 'docs/README.md'
      - 'docs/QUICKSTART.md'
      - 'docs/SHARE_ON_X.md'
      - 'experiments/README.md'
      - 'results/README.md'
      - 'docs/RESEARCH_STATUS.md'
      - 'docs/RESEARCH_ROADMAP.md'
      - 'docs/ROADMAP_VALIDATION_20260926_RESULT.md'
      - 'results/roadmap_validation_20260926_primary.csv'
      - 'results/roadmap_validation_20260926_pool_contrasts.csv'
      - 'scripts/check_roadmap_validation_results.py'
      - 'scripts/check_switch_seed_results.py'
      - 'scripts/check_switch_time_boundary_20261107.py'
      - 'docs/SWITCH_TIME_BOUNDARY_RESULT_20261107.md'
      - 'results/switch_time_20261107_primary.csv'
      - 'results/switch_time_20261107_pool_differences.csv'
      - 'results/switch_time_20261107_policy_means.csv'
      - 'results/switch_seed_20261031_primary_decisions.csv'
      - 'results/switch_seed_20261031_pool_differences.csv'
      - 'docs/OPTIMIZER_SWITCH_SEED_RESULT_20261031.md'
      - 'results/translation_matched_primary30.csv'
      - 'results/translation_matched_summary30.csv'
      - 'requirements-check.txt'
      - 'scripts/check_public_results.py'
      - 'scripts/test_public_results.py'
      - 'scripts/check_public_docs.py'
      - '.github/workflows/publication_check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only verification dependencies
        run: python -m pip install -r requirements-check.txt
      - name: Reject malformed public result inputs
        run: python -m unittest discover -s scripts -p 'test_public_results.py'
      - name: Recompute public performance summaries without training
        run: python scripts/check_public_results.py
      - name: Recompute registered six-pool results without training
        run: python scripts/check_roadmap_validation_results.py
      - name: Verify locally frozen switching-seed CSVs (statistics only)
        run: python scripts/check_switch_seed_results.py
      - name: Recompute prospective switch-time 12-pool Holm3 statistics
        run: python scripts/check_switch_time_boundary_20261107.py
      - name: Verify existing public paired and algebra checks
        run: |
          python experiments/check_parameter_matched_evidence.py
          python experiments/check_spatial_allocation_evidence.py
          python experiments/check_novelty_coherence_identity.py
      - name: Verify publication-page local links
        run: python scripts/check_public_docs.py
