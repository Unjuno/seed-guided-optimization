name: Reserve-image dose interaction replication

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - 'experiments/reserve_dose_replication.py'
      - '.github/workflows/reserve_dose_replication.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {start: 1300, end: 1305}
          - {start: 1305, end: 1310}
          - {start: 1310, end: 1315}
          - {start: 1315, end: 1320}
          - {start: 1320, end: 1325}
          - {start: 1325, end: 1330}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned CPU runtime
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Split and synthetic self-tests only
        run: python experiments/reserve_dose_replication.py selftest
      - name: Train and seal all shard states before reserve evaluation
        run: python experiments/reserve_dose_replication.py train --start ${{ matrix.start }} --end ${{ matrix.end }} --output-dir artifacts
      - name: Verify seals and evaluate fixed reserve-image strengths
        run: python experiments/reserve_dose_replication.py evaluate --start ${{ matrix.start }} --end ${{ matrix.end }} --output-dir artifacts
      - name: Archive source and dependency provenance
        if: always()
        run: |
          mkdir -p artifacts/source
          cp experiments/common.py experiments/transfer_specificity.py experiments/fixed_dose_response.py experiments/reserve_dose_replication.py requirements.txt artifacts/source/
          python -m pip freeze > artifacts/pip-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reserve-dose-shard-${{ matrix.start }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU summarizer runtime
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - uses: actions/download-artifact@v4
        with:
          pattern: reserve-dose-shard-*
          path: downloaded
          merge-multiple: false
      - name: Verify all hashes and apply frozen Issue 64 decision
        run: python experiments/reserve_dose_replication.py summarize --input-dir downloaded --output-dir aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: reserve-dose-aggregate30
          path: aggregate/*.csv
          if-no-files-found: error
          retention-days: 90
