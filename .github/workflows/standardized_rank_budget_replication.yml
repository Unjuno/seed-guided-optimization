name: Scale-invariant mediator Q-scaling replication

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/standardized_rank_budget_replication.py'
      - 'experiments/summarize_standardized_rank_budget_replication.py'
      - '.github/workflows/standardized_rank_budget_replication.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: reps300_304
            start: 300
            end: 305
          - shard: reps305_309
            start: 305
            end: 310
          - shard: reps310_314
            start: 310
            end: 315
          - shard: reps315_319
            start: 315
            end: 320
          - shard: reps320_324
            start: 320
            end: 325
          - shard: reps325_329
            start: 325
            end: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run sealed training-only diagnostics
        run: |
          mkdir -p artifacts
          python experiments/standardized_rank_budget_replication.py train \
            --start ${{ matrix.start }} \
            --end ${{ matrix.end }} \
            --output-dir artifacts
      - name: Evaluate fresh held-out environments
        run: |
          python experiments/standardized_rank_budget_replication.py evaluate \
            --start ${{ matrix.start }} \
            --end ${{ matrix.end }} \
            --output-dir artifacts
      - name: Remove model states before upload
        if: always()
        run: rm -rf artifacts/states
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standardized-rank-budget-${{ matrix.shard }}
          path: artifacts/*.csv
          if-no-files-found: warn

  aggregate:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install summarizer dependencies
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0
      - uses: actions/download-artifact@v4
        with:
          pattern: standardized-rank-budget-*
          path: downloaded
          merge-multiple: true
      - name: Apply preregistered mediator decision
        run: |
          python experiments/summarize_standardized_rank_budget_replication.py \
            --input-dir downloaded \
            --output-dir aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: standardized-rank-budget-aggregate30
          path: aggregate/*.csv
          if-no-files-found: error
