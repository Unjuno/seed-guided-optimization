name: Strong matched reusable-structure confirmation

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - 'experiments/strong_shared_nuisance_confirmation.py'
      - '.github/workflows/strong_shared_nuisance_confirmation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        start: [4300,4303,4306,4309,4312,4315,4318,4321,4324,4327]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Pinned CPU dependencies
        run: |
          pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Synthetic protocol tests
        run: python experiments/strong_shared_nuisance_confirmation.py selftest
      - name: Train and seal states only
        run: python experiments/strong_shared_nuisance_confirmation.py train --start ${{ matrix.start }} --end $(( ${{ matrix.start }} + 3 )) --output-dir artifact
      - name: Archive source and backend
        run: |
          mkdir -p artifact/source
          cp experiments/*.py artifact/source/
          pip freeze > artifact/pip-freeze.txt
      - uses: actions/upload-artifact@v4
        with:
          name: strong-reusability-train-${{ matrix.start }}
          path: artifact/
          retention-days: 90
          if-no-files-found: error

  training-match-seal:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned validator runtime
        run: |
          pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - uses: actions/download-artifact@v4
        with:
          pattern: strong-reusability-train-*
          path: downloaded
      - name: Verify fresh training-only match before heldout
        run: python experiments/strong_shared_nuisance_confirmation.py train-seal --input-dir downloaded --output-dir seal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strong-reusability-training-global-seal
          path: seal/
          retention-days: 90
          if-no-files-found: warn

  evaluate:
    needs: training-match-seal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        start: [4300,4303,4306,4309,4312,4315,4318,4321,4324,4327]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Pinned CPU dependencies
        run: |
          pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - uses: actions/download-artifact@v4
        with:
          name: strong-reusability-train-${{ matrix.start }}
          path: artifact
      - uses: actions/download-artifact@v4
        with:
          name: strong-reusability-training-global-seal
          path: global
      - name: Construct heldout only after training match seal
        run: python experiments/strong_shared_nuisance_confirmation.py evaluate --start ${{ matrix.start }} --end $(( ${{ matrix.start }} + 3 )) --output-dir artifact --global-seal global/train_seal.json
      - uses: actions/upload-artifact@v4
        with:
          name: strong-reusability-eval-${{ matrix.start }}
          path: artifact/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned validator runtime
        run: |
          pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - uses: actions/download-artifact@v4
        with:
          pattern: strong-reusability-eval-*
          path: downloaded
      - uses: actions/download-artifact@v4
        with:
          name: strong-reusability-training-global-seal
          path: global
      - name: Apply frozen conversion decision
        run: python experiments/strong_shared_nuisance_confirmation.py summarize --input-dir downloaded --output-dir aggregate --global-seal global/train_seal.json
      - uses: actions/upload-artifact@v4
        with:
          name: strong-reusability-confirmation-evidence
          path: |
            aggregate/
            downloaded/
            global/
          retention-days: 90
          if-no-files-found: error
